<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>خزنة العائلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    color-scheme: only light;
    --navy:#082052;          /* أساسي */
    --navy-2:#0c2a6b;        /* تدرّج أفتح */
    --navy-deep:#05163a;     /* عمق */
    --cream:#F8F0E5;         /* خلفية */
    --cream-2:#fffaf3;       /* بطاقات */
    --gold:#c6a04e;          /* لمسة فخامة */
    --gold-soft:#e3cd9a;
    --ink:#16203a;
    --muted:#6a7390;
    --line:#e7ddcb;
    --ok:#1f7a52;
    --ok-bg:#e3f1e8;
    --warn:#a6601a;
    --warn-bg:#f6e9d6;
    --danger:#a32f2f;
    --danger-bg:#f6e0dd;
    --shadow:0 10px 30px rgba(8,32,82,.10);
    --shadow-sm:0 4px 14px rgba(8,32,82,.07);
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Tajawal',system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.kufi{font-family:'Reem Kufi',serif;font-weight:600;letter-spacing:.2px}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* ===== Top bar ===== */
  .topbar{
    background:linear-gradient(135deg,var(--navy-deep),var(--navy) 55%,var(--navy-2));
    color:#fff;position:sticky;top:0;z-index:40;
    border-bottom:1px solid rgba(198,160,78,.35);
  }
  .topbar-inner{max-width:1120px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:12px}
  .seal{width:42px;height:42px;flex:none}
  .brand h1{font-size:21px;color:#fff;line-height:1.1}
  .brand .sub{font-size:11.5px;color:var(--gold-soft);font-family:'Tajawal';letter-spacing:2px}
  .topbar .spacer{flex:1}
  .mgr-toggle{
    display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);
    border:1px solid rgba(198,160,78,.4);border-radius:999px;padding:7px 14px;color:#fff;
    font-size:13px;font-weight:500;transition:.2s;
  }
  .mgr-toggle:hover{background:rgba(255,255,255,.14)}
  .mgr-dot{width:8px;height:8px;border-radius:50%;background:#7d8aa8;transition:.2s}
  .mgr-toggle.on .mgr-dot{background:var(--gold);box-shadow:0 0 0 4px rgba(198,160,78,.25)}
  .mgr-toggle.on{border-color:var(--gold)}

  /* ===== Tabs ===== */
  .tabs{background:var(--navy-deep);position:sticky;top:71px;z-index:39}
  .tabs-inner{max-width:1120px;margin:0 auto;padding:0 14px;display:flex;gap:4px;overflow-x:auto}
  .tab{color:#aab6d4;padding:13px 18px;font-size:14.5px;font-weight:500;white-space:nowrap;
       border-bottom:2.5px solid transparent;transition:.18s}
  .tab:hover{color:#fff}
  .tab.active{color:#fff;border-color:var(--gold)}

  /* ===== Layout ===== */
  main{max-width:1120px;margin:0 auto;padding:28px 22px 80px}
  .view{display:none;animation:fade .35s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .page-head .eyebrow{font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:700;margin-bottom:4px}
  .page-head h2{font-size:27px;color:var(--navy)}
  .page-head p{color:var(--muted);font-size:14px;margin-top:3px}

  /* ===== Buttons ===== */
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:11px 18px;
       font-size:14px;font-weight:700;transition:.18s;border:1px solid transparent}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:hover{background:var(--navy-2)}
  .btn-gold{background:var(--gold);color:var(--navy-deep)}
  .btn-gold:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;color:var(--navy);border-color:var(--line)}
  .btn-ghost:hover{background:#fff;border-color:var(--gold)}
  .btn-sm{padding:8px 13px;font-size:13px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* ===== Cards / grid ===== */
  .grid{display:grid;gap:18px}
  .stat-grid{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
  .vault-grid{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}

  .stat{
    background:var(--cream-2);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 22px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  }
  .stat::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--gold);opacity:.0}
  .stat .label{font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
  .stat .value{font-size:29px;font-weight:800;color:var(--navy);margin-top:8px;line-height:1.1}
  .stat .value .cur{font-size:14px;color:var(--muted);font-weight:600;margin-inline-start:4px}
  .stat .foot{font-size:12.5px;color:var(--muted);margin-top:7px}
  .stat.accent{background:linear-gradient(150deg,var(--navy),var(--navy-2));border-color:transparent}
  .stat.accent .label,.stat.accent .foot{color:#bcc7e3}
  .stat.accent .value{color:#fff}
  .stat.accent .value .cur{color:var(--gold-soft)}

  .card{background:var(--cream-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
  .card-table{background:var(--cream-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* vault card */
  .vault{padding:0;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
  .vault:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
  .vault .v-top{background:linear-gradient(140deg,var(--navy),var(--navy-2));color:#fff;padding:18px 20px;position:relative}
  .v-top .seal-wm{position:absolute;left:-14px;bottom:-22px;width:96px;opacity:.13}
  .v-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;padding:3px 10px;border-radius:999px;
           background:rgba(198,160,78,.2);color:var(--gold-soft);border:1px solid rgba(198,160,78,.4);margin-bottom:9px}
  .v-badge.ext{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
  .vault h3{font-size:19px;color:#fff;position:relative}
  .v-cycle{font-size:12.5px;color:#aeb9d8;margin-top:3px;position:relative}
  .v-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
  .v-balance{display:flex;align-items:baseline;justify-content:space-between}
  .v-balance .lbl{font-size:12.5px;color:var(--muted)}
  .v-balance .amt{font-size:25px;font-weight:800;color:var(--navy)}
  .v-meta{display:flex;gap:18px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .v-meta b{color:var(--ink);font-weight:700}
  .progress{height:8px;background:#efe6d6;border-radius:99px;overflow:hidden}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:99px}
  .v-foot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:#fff}

  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.late{background:var(--warn-bg);color:var(--warn)}
  .chip.debt{background:var(--danger-bg);color:var(--danger)}

  /* tables */
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th{ text-align:right;color:var(--muted);font-weight:600;font-size:12.5px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .tbl td{padding:12px 14px;border-bottom:1px solid #f0e8da}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr:hover td{background:#fffdf8}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;
          align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
  .person{display:flex;align-items:center;gap:11px}

  .section-title{font-family:'Reem Kufi';font-size:17px;color:var(--navy);margin:26px 0 13px;display:flex;align-items:center;gap:10px}
  .section-title::before{content:"";width:6px;height:18px;background:var(--gold);border-radius:3px;display:inline-block}

  .empty{text-align:center;padding:46px 20px;color:var(--muted)}
  .empty .seal{width:54px;opacity:.4;margin-bottom:12px}

  /* manager-only hint */
  .mgr-only{display:none!important}
  body.mgr .mgr-only{display:inline-flex!important}
  .locked-note{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}

  /* ===== Modal ===== */
  .overlay{position:fixed;inset:0;background:rgba(5,16,40,.55);backdrop-filter:blur(3px);
           display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
  .overlay.show{display:flex}
  .modal{background:var(--cream-2);border-radius:22px;max-width:480px;width:100%;box-shadow:0 30px 80px rgba(5,16,40,.4);
         max-height:90vh;overflow:auto;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .modal-head{background:linear-gradient(140deg,var(--navy),var(--navy-2));color:#fff;padding:20px 24px;
              border-radius:22px 22px 0 0;display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{color:#fff;font-size:19px}
  .modal-head .x{color:#cfd8ee;font-size:24px;line-height:1;padding:2px 6px;border-radius:8px}
  .modal-head .x:hover{background:rgba(255,255,255,.12);color:#fff}
  .modal-body{padding:22px 24px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:7px}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;
    font-family:inherit;font-size:14px;color:var(--ink);transition:.15s
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(198,160,78,.18)}
  .field .hint{font-size:12px;color:var(--muted);margin-top:5px}
  .checks{display:flex;flex-direction:column;gap:9px;max-height:200px;overflow:auto;border:1px solid var(--line);
          border-radius:12px;padding:12px;background:#fff}
  .check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
  .check input{width:auto;accent-color:var(--gold)}
  .modal-foot{display:flex;gap:10px;justify-content:flex-start;padding:18px 24px;border-top:1px solid var(--line)}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg label{flex:1;min-width:120px}
  .seg .opt{display:block;border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center;font-size:13.5px;
            font-weight:600;cursor:pointer;background:#fff;transition:.15s}
  .seg input{display:none}
  .seg input:checked + .opt{border-color:var(--gold);background:#fff7e9;color:var(--navy);box-shadow:0 0 0 2px rgba(198,160,78,.2) inset}

  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy-deep);
         color:#fff;padding:13px 22px;border-radius:13px;font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(5,16,40,.4);
         opacity:0;pointer-events:none;transition:.3s;z-index:80;border:1px solid rgba(198,160,78,.4)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{color:var(--gold-soft)}

  /* detail panel header */
  .detail-hero{background:linear-gradient(140deg,var(--navy-deep),var(--navy) 60%,var(--navy-2));color:#fff;
               border-radius:var(--r);padding:26px 26px;position:relative;overflow:hidden;margin-bottom:8px}
  .detail-hero .seal-wm{position:absolute;left:-20px;top:-20px;width:150px;opacity:.12}
  .detail-hero .v-badge{margin-bottom:10px}
  .detail-hero h2{color:#fff;font-size:25px}
  .detail-hero .dh-balance{margin-top:16px;display:flex;gap:30px;flex-wrap:wrap}
  .dh-balance .it .l{font-size:12px;color:#aeb9d8}
  .dh-balance .it .v{font-size:24px;font-weight:800;color:#fff;margin-top:2px}
  .dh-balance .it .v.gold{color:var(--gold-soft)}
  .back-link{display:inline-flex;align-items:center;gap:7px;color:var(--navy);font-weight:700;font-size:14px;margin-bottom:16px}
  .back-link:hover{color:var(--gold)}

  .row-actions{display:flex;gap:7px;flex-wrap:wrap}
  .txn-type{font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px}
  .t-in{background:var(--ok-bg);color:var(--ok)}
  .t-out{background:var(--danger-bg);color:var(--danger)}
  .amount-in{color:var(--ok);font-weight:700}
  .amount-out{color:var(--danger);font-weight:700}

  /* ===== Gate (بوابة الدخول) ===== */
  .gate{position:fixed;inset:0;z-index:100;background:linear-gradient(150deg,var(--navy-deep),var(--navy) 55%,var(--navy-2));
        display:flex;align-items:center;justify-content:center;padding:22px;transition:opacity .4s,visibility .4s}
  .gate.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .gate-card{width:100%;max-width:400px;text-align:center;color:#fff}
  .gate-card .seal{width:74px;height:74px;margin:0 auto 14px;display:block}
  .gate-card h1{font-family:'Reem Kufi';font-size:28px;color:#fff;margin-bottom:4px}
  .gate-card .sub{font-size:12px;letter-spacing:3px;color:var(--gold-soft);margin-bottom:30px}
  .gate-form{background:rgba(255,255,255,.06);border:1px solid rgba(198,160,78,.4);border-radius:20px;padding:26px 24px}
  .gate-form label{display:block;text-align:right;font-size:13.5px;font-weight:700;color:#dfe6f5;margin-bottom:9px}
  .gate-input{width:100%;padding:13px 15px;border:1px solid rgba(255,255,255,.18);border-radius:13px;
        background:rgba(0,0,0,.18);color:#fff;font-family:inherit;font-size:16px;text-align:center;letter-spacing:2px;transition:.15s}
  .gate-input::placeholder{color:#7d8aa8;letter-spacing:normal}
  .gate-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(198,160,78,.25)}
  .gate-form .btn{width:100%;justify-content:center;margin-top:16px;padding:13px}
  .gate-err{color:#ffb4ab;font-size:13px;margin-top:12px;min-height:18px;font-weight:500}
  .gate-switch{margin-top:22px;font-size:13px}
  .gate-switch a{color:var(--gold-soft);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .gate-switch a:hover{color:#fff}
  .gate-back{color:#aab6d4;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
  .gate-back:hover{color:#fff}
  .demo-note{margin-top:18px;font-size:11.5px;color:#8b97b6;line-height:1.7}
  .demo-note code{background:rgba(255,255,255,.1);color:var(--gold-soft);padding:1px 7px;border-radius:6px;font-family:monospace}

  .lock-btn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
        border-radius:999px;padding:7px 13px;color:#cfd8ee;font-size:13px;font-weight:500;transition:.18s}
  .lock-btn:hover{background:rgba(255,255,255,.14);color:#fff}

  @media(max-width:560px){
    .brand h1{font-size:18px}
    .page-head h2{font-size:23px}
    .topbar-inner{padding:12px 16px}
    main{padding:22px 16px 70px}
    .tbl{min-width:560px}
    .tbl th,.tbl td{padding:10px 12px}
    .brand .sub{display:none}
  }
</style>
</head>
<body>

<!-- ===== بوابة الدخول ===== -->
<div class="gate" id="gate">
  <div class="gate-card">
    <svg class="seal" viewBox="0 0 64 64" fill="none">
      <path d="M32 3l24 9v18c0 16-10.4 26.4-24 31C18.4 56.4 8 46 8 30V12l24-9z" fill="#0a2a66" stroke="#c6a04e" stroke-width="2.2"/>
      <circle cx="32" cy="28" r="7" fill="none" stroke="#e3cd9a" stroke-width="2.4"/>
      <rect x="30.4" y="32" width="3.2" height="11" rx="1.6" fill="#e3cd9a"/>
    </svg>
    <h1>خزنة العائلة</h1>
    <div class="sub">FAMILY&nbsp;VAULT</div>

    <!-- دخول العائلة بالرمز -->
    <div class="gate-form" id="gateFamily">
      <label for="famCode">رمز العائلة للعرض</label>
      <input class="gate-input" id="famCode" type="password" inputmode="numeric" placeholder="••••" autocomplete="off"
             onkeydown="if(event.key==='Enter')unlockFamily()"/>
      <button class="btn btn-gold" onclick="unlockFamily()">دخول</button>
      <div class="gate-err" id="famErr"></div>
      <div class="gate-switch">للمدير؟ <a onclick="showGate('manager')">تسجيل دخول المدير</a></div>
    </div>

    <!-- دخول المدير -->
    <div class="gate-form" id="gateManager" style="display:none">
      <div class="gate-back" onclick="showGate('family')">↪ رجوع</div>
      <label for="mgrEmail">بريد المدير</label>
      <input class="gate-input" id="mgrEmail" type="email" placeholder="manager@…" style="text-align:right;letter-spacing:normal" autocomplete="username"/>
      <label for="mgrPass" style="margin-top:14px">كلمة المرور</label>
      <input class="gate-input" id="mgrPass" type="password" placeholder="••••••••" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')loginManager()"/>
      <button class="btn btn-gold" onclick="loginManager()">دخول المدير</button>
      <div class="gate-err" id="mgrErr"></div>
    </div>

    <div class="demo-note" id="demoNote">
      خزنة العائلة — للعرض أدخل رمز العائلة، وللإدارة سجّل دخول المدير.
    </div>
  </div>
</div>


<!-- Top bar -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="seal" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M32 3l24 9v18c0 16-10.4 26.4-24 31C18.4 56.4 8 46 8 30V12l24-9z" fill="#0a2a66" stroke="#c6a04e" stroke-width="2.2"/>
        <path d="M32 9l18 6.8V30c0 12.6-8 21.2-18 25-10-3.8-18-12.4-18-25V15.8L32 9z" stroke="#c6a04e" stroke-width="1" opacity=".5"/>
        <circle cx="32" cy="28" r="7" fill="none" stroke="#e3cd9a" stroke-width="2.4"/>
        <rect x="30.4" y="32" width="3.2" height="11" rx="1.6" fill="#e3cd9a"/>
        <circle cx="32" cy="28" r="2.4" fill="#0a2a66"/>
      </svg>
      <div>
        <h1>خزنة العائلة</h1>
        <div class="sub">FAMILY&nbsp;VAULT</div>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="mgr-toggle" id="rolePill"><span class="mgr-dot"></span><span id="mgrLabel">عرض فقط</span></span>
    <button class="lock-btn" onclick="lockApp()">قفل ⟲</button>
  </div>
</header>

<!-- Tabs -->
<nav class="tabs">
  <div class="tabs-inner">
    <button class="tab active" data-view="dashboard" onclick="go('dashboard')">الرئيسية</button>
    <button class="tab" data-view="vaults" onclick="go('vaults')">الخزنات</button>
    <button class="tab" data-view="members" onclick="go('members')">الأعضاء</button>
    <button class="tab" data-view="debts" onclick="go('debts')">الديون</button>
  </div>
</nav>

<main>
  <section id="dashboard" class="view active"></section>
  <section id="vaults" class="view"></section>
  <section id="vault-detail" class="view"></section>
  <section id="members" class="view"></section>
  <section id="debts" class="view"></section>
</main>

<!-- Modal host -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   حالة التطبيق (بيانات تجريبية في الذاكرة).
   عند الربط بـ Supabase، استبدل دوال data.* باستعلامات/إدراج.
   ============================================================ */
const CUR = 'ر.س';
const CYCLES = {weekly:'أسبوعية', monthly:'شهرية', quarterly:'ربع سنوية', semiannual:'نصف سنوية', annual:'سنوية'};
const CURRENT_PERIOD = '2026-06'; // الدورة الحالية (للعرض التجريبي)

// تُملأ من Supabase عبر loadData() بعد الدخول. الأشكال هنا مطابقة لما تتوقعه دوال العرض.
const db = { members: [], vaults: [], txns: [] };

/* ---------- حسابات ---------- */
const memberName = id => (db.members.find(m=>m.id===id)||{}).name || '—';
const vaultById  = id => db.vaults.find(v=>v.id===id);
const dir = type => ({opening:1,contribution:1,debt_repay:1,spending:-1,temp_withdraw:-1,external_repay:-1})[type];

function vaultBalance(vid){
  const v = vaultById(vid);
  let b = v.opening||0;
  db.txns.filter(x=>x.vault===vid).forEach(x=> b += x.amount*dir(x.type));
  return b;
}
function vaultTxns(vid){return db.txns.filter(x=>x.vault===vid).slice().sort((a,b)=> (a.date<b.date?1:-1))}

// اشتراكات الدورة الحالية لخزنة: من سدّد ومن تأخّر
function cycleStatus(vid){
  const v = vaultById(vid);
  const paid = new Set(db.txns.filter(x=>x.vault===vid && x.type==='contribution' && x.period===CURRENT_PERIOD).map(x=>x.member));
  return v.members.map(mid => ({member:mid, paid:paid.has(mid)}));
}
// ديون عضو من السحب المؤقت، مفصّلة بالخزنة
function memberDebts(mid){
  const map = {};
  db.txns.filter(x=>x.member===mid && (x.type==='temp_withdraw'||x.type==='debt_repay')).forEach(x=>{
    map[x.vault] = (map[x.vault]||0) + x.amount*(x.type==='temp_withdraw'?1:-1);
  });
  return Object.entries(map).filter(([,amt])=>amt>0.001).map(([vid,amt])=>({vault:vid, remaining:amt}));
}
function memberDebtTotal(mid){return memberDebts(mid).reduce((s,d)=>s+d.remaining,0)}
function allDebtsTotal(){return db.members.reduce((s,m)=>s+memberDebtTotal(m.id),0)}

function externalRemaining(vid){
  const v = vaultById(vid);
  const repaid = db.txns.filter(x=>x.vault===vid && x.type==='external_repay').reduce((s,x)=>s+x.amount,0);
  return {repaid, remaining:(v.creditorTotal||0)-repaid};
}

const fmt = n => Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const money = n => `<span class="num">${fmt(n)}</span> <span class="cur">${CUR}</span>`;

// جلب كل البيانات من Supabase وتحويلها لأشكال دوال العرض
async function loadData(){
  const [mr, vr, vmr, tr] = await Promise.all([
    sb.from('members').select('*').order('created_at'),
    sb.from('vaults').select('*').order('created_at'),
    sb.from('vault_members').select('*'),
    sb.from('transactions').select('*').order('created_at'),
  ]);
  const members = mr.data||[], vaults = vr.data||[], vm = vmr.data||[], txns = tr.data||[];
  db.members = members.map(m=>({id:m.id, name:m.name}));
  db.vaults  = vaults.map(v=>({
    id:v.id, name:v.name, type:v.type, cycle:v.cycle,
    amount:+v.contribution_amount, opening:+v.opening_balance,
    target:v.target_amount!=null?+v.target_amount:null,
    creditorName:v.creditor_name,
    creditorTotal:v.creditor_total!=null?+v.creditor_total:null,
    members:vm.filter(x=>x.vault_id===v.id).map(x=>x.member_id),
  }));
  db.txns = txns.map(t=>({
    id:t.id, vault:t.vault_id, type:t.type, amount:+t.amount,
    member:t.member_id, note:t.note, period:t.period,
    date:(t.created_at||'').slice(0,10),
  }));
}

  return `<div class="card card-table"><table class="tbl">

function vaultCard(v){

  let progress='';
  if(isExt){

    progress=`<div><div class="v-balance" style="margin-bottom:6px"><span class="lbl">سُدّد للدائن ${v.creditorName||''}</span><b class="num" style="color:var(--navy)">${pct}%</b></div>

      <div class="v-meta" style="margin-top:8px"><span>المتبقي: <b>${fmt(e.remaining)} ${CUR}</b></span></div></div>`;
  } else if(v.target){
    const pct=Math.min(100,Math.round(bal/v.target*100));
    progress=`<div><div class="v-balance" style="margin-bottom:6px"><span class="lbl">نحو الهدف ${fmt(v.target)} ${CUR}</span><b class="num" style="color:var(--navy)">${pct}%</b></div>

      <span class="v-badge ${isExt?'ext':''}">${isExt?'دين خارجي':'دورية'}</span>

      ${progress}
      <div class="v-meta">
        <span>${ico('users',14)} <b>${memCount}</b> أعضاء</span>
        ${late?`<span style="color:var(--warn)">${ico('clock',14)} <b>${late}</b> متأخر</span>`:`<span style="color:var(--ok)">${ico('check',14)} الجميع سدّد</span>`}

async function saveVault(){
  if(!isManager){toast('هذا الإجراء متاح للمدير فقط');return;}
  const name=document.getElementById('v_name').value.trim();
  const type=document.querySelector('[name=vtype]:checked').value;
  const amount=+document.getElementById('v_amount').value||0;
  if(!name)return toast('اكتب اسم الخزنة');
  const row={name,type,cycle:document.getElementById('v_cycle').value,contribution_amount:amount};
  if(type==='external_debt'){row.creditor_name=document.getElementById('v_creditor').value.trim();
    row.creditor_total=+document.getElementById('v_cred_total').value||0;}
  else{row.opening_balance=+document.getElementById('v_open').value||0;
    const tg=document.getElementById('v_target').value;row.target_amount=tg?+tg:null;}
  const {error}=await sb.from('vaults').insert(row);
  if(error)return toast('تعذّر إنشاء الخزنة');
  closeModal();toast(`تم إنشاء خزنة <b>${name}</b>`);await loadData();go('vaults');
}

async function saveWithdraw(vid){
  if(!isManager){toast('هذا الإجراء متاح للمدير فقط');return;}

  const amount=+document.getElementById('w_amount').value||0;

  closeModal();toast(type==='temp_withdraw'?`سُجِّل دين <b>${fmt(amount)} ${CUR}</b> على ${memberName(member)}`:`تم صرف <b>${fmt(amount)} ${CUR}</b>`);

}

/* ---------- تعديل / حذف عضو ---------- */
function openEditMember(mid){
  if(!guard())return;const m=db.members.find(x=>x.id===mid);
  openModal(`<div class="modal-head"><h3>تعديل عضو</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>اسم العضو</label><input id="em_name" value="${m.name}"/></div>
      <div class="field"><label>عضوية الخزنات</label><div class="checks">
        ${db.vaults.map(v=>`<label class="check"><input type="checkbox" class="emv" value="${v.id}" ${v.members.includes(mid)?'checked':''}/> ${v.name}</label>`).join('')}
      </div></div>
      <div class="field"><button class="btn btn-ghost btn-sm" style="color:var(--danger);border-color:#eccfcb" onclick="askDeleteMember('${mid}')">حذف هذا العضو نهائيًا</button></div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="saveMemberEdit('${mid}')">حفظ التعديل</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>`);
}
async function saveMemberEdit(mid){
  if(!isManager){toast('هذا الإجراء متاح للمدير فقط');return;}
  const name=document.getElementById('em_name').value.trim();if(!name)return toast('اكتب اسم العضو');
  const checked=[...document.querySelectorAll('.emv:checked')].map(c=>c.value);
  const {error}=await sb.from('members').update({name}).eq('id',mid);
  if(error)return toast('تعذّر الحفظ');
  const cur=db.vaults.filter(v=>v.members.includes(mid)).map(v=>v.id);
  const toAdd=checked.filter(id=>!cur.includes(id));
  const toDel=cur.filter(id=>!checked.includes(id));
  if(toAdd.length) await sb.from('vault_members').insert(toAdd.map(vid=>({vault_id:vid,member_id:mid})));
  for(const vid of toDel){ await sb.from('vault_members').delete().eq('vault_id',vid).eq('member_id',mid); }
  closeModal();toast('تم حفظ التعديل');await reload();
}
function askDeleteMember(mid){
  if(!isManager){toast('هذا الإجراء متاح للمدير فقط');return;}
  const m=db.members.find(x=>x.id===mid);
  const debt=memberDebtTotal(mid);
  const hasTx=db.txns.some(t=>t.member===mid);
  const warn=debt>0?` تنبيه: عليه دين قائم <b>${fmt(debt)} ${CUR}</b> وستُحذف حركاته أيضًا.`:(hasTx?' له حركات مسجّلة ستُحذف معه.':'');
  confirmAction(`حذف <b>${m.name}</b> نهائيًا؟${warn}`, async ()=>{
    const {error}=await sb.from('members').delete().eq('id',mid);
    if(error)return toast('تعذّر الحذف');
    closeModal();toast('تم حذف العضو');await reload();
  });
}

/* ---------- تعديل / حذف حركة (تصحيح المبالغ) ---------- */
function openEditTxn(id){
  if(!guard())return;const x=db.txns.find(t=>t.id===id);
  const labels={opening:'افتتاحي',contribution:'اشتراك',spending:'صرف للغرض',temp_withdraw:'سحب مؤقت (دين)',debt_repay:'سداد دين',external_repay:'سداد للدائن'};
  openModal(`<div class="modal-head"><h3>تعديل المبلغ</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>نوع الحركة</label><input value="${labels[x.type]}" disabled/></div>
      ${x.member?`<div class="field"><label>العضو</label><input value="${memberName(x.member)}" disabled/></div>`:''}
      <div class="field"><label>المبلغ (${CUR})</label><input id="et_amt" type="number" min="1" value="${x.amount}"/>
        <div class="hint">تصحيح المبلغ يُحدّث الرصيد والديون تلقائيًا.</div></div>
      <div class="field"><label>الوصف</label><input id="et_note" value="${x.note||''}"/></div>
      <div class="field"><button class="btn btn-ghost btn-sm" style="color:var(--danger);border-color:#eccfcb" onclick="askDeleteTxn('${id}')">حذف هذه الحركة</button></div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="saveTxnEdit('${id}')">حفظ التعديل</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>`);
}
async function saveTxnEdit(id){
  if(!isManager){toast('هذا الإجراء متاح للمدير فقط');return;}
  const amt=+document.getElementById('et_amt').value||0;if(amt<=0)return toast('أدخل مبلغًا صحيحًا');
  const note=document.getElementById('et_note').value.trim();
  const upd={amount:amt}; if(note) upd.note=note;
  const {error}=await sb.from('transactions').update(upd).eq('id',id);
  if(error)return toast('تعذّر التعديل');
  closeModal();toast(`تم تعديل المبلغ إلى <b>${fmt(amt)} ${CUR}</b>`);await reload();
}
function askDeleteTxn(id){
  if(!isManager){toast('هذا الإجراء متاح للمدير فقط');return;}
  confirmAction('حذف هذه الحركة نهائيًا؟ سيتأثّر رصيد الخزنة.', async ()=>{
    const {error}=await sb.from('transactions').delete().eq('id',id);
    if(error)return toast('تعذّر الحذف');
    closeModal();toast('تم حذف الحركة');await reload();
  });
}

/* ---------- تعديل مبالغ الخزنة / حذفها ---------- */
function openEditVault(vid){
  if(!guard())return;const v=vaultById(vid);
  openModal(`<div class="modal-head"><h3>تعديل مبالغ الخزنة</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>اشتراك العضو في الدورة (${CUR})</label><input id="ev_amount" type="number" min="0" value="${v.amount}"/></div>
      ${v.type==='external_debt'
        ? `<div class="field"><label>إجمالي الدين الخارجي (${CUR})</label><input id="ev_cred" type="number" min="0" value="${v.creditorTotal||0}"/></div>`
        : `<div class="field"><label>الرصيد الافتتاحي (${CUR})</label><input id="ev_open" type="number" value="${v.opening||0}"/>
            <div class="hint">المبلغ الذي كان موجودًا عند بدء النظام.</div></div>
           <div class="field"><label>الهدف / السقف (اختياري)</label><input id="ev_target" type="number" value="${v.target||''}" placeholder="مفتوح"/></div>`}
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="saveVaultEdit('${vid}')">حفظ</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>`);
}
async function saveVaultEdit(vid){
  if(!isManager){toast('هذا الإجراء متاح للمدير فقط');return;}
  const v=vaultById(vid);
  const upd={contribution_amount:+document.getElementById('ev_amount').value||0};
  if(v.type==='external_debt'){upd.creditor_total=+document.getElementById('ev_cred').value||0;}
  else{upd.opening_balance=+document.getElementById('ev_open').value||0;const tg=document.getElementById('ev_target').value;upd.target_amount=tg?+tg:null;}
  const {error}=await sb.from('vaults').update(upd).eq('id',vid);
  if(error)return toast('تعذّر الحفظ');
  closeModal();toast('تم حفظ تعديل المبالغ');await reload();
}
function askDeleteVault(vid){
  if(!isManager){toast('هذا الإجراء متاح للمدير فقط');return;}
  const v=vaultById(vid);
  confirmAction(`حذف خزنة <b>${v.name}</b> وكل حركاتها نهائيًا؟`, async ()=>{
    const {error}=await sb.from('vaults').delete().eq('id',vid);
    if(error)return toast('تعذّر الحذف');
    closeModal();toast('تم حذف الخزنة');currentVaultId=null;await loadData();go('vaults');
  });
}

/* ---------- أدوات ---------- */
function today(){return new Date().toISOString().slice(0,10)}
function toast(html){const t=document.getElementById('toast');t.innerHTML=html;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
function sealSvg(size=64,cls=''){return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 64 64" fill="none">
  <path d="M32 3l24 9v18c0 16-10.4 26.4-24 31C18.4 56.4 8 46 8 30V12l24-9z" fill="#0a2a66" stroke="#c6a04e" stroke-width="2.2"/>
  <circle cx="32" cy="28" r="7" fill="none" stroke="#e3cd9a" stroke-width="2.4"/>
  <rect x="30.4" y="32" width="3.2" height="11" rx="1.6" fill="#e3cd9a"/></svg>`}
function ico(n,s=15){const p={
  vault:'<path d="M3 5h18v14H3z"/><circle cx="12" cy="12" r="3"/>',
  coins:'<circle cx="8" cy="8" r="5"/><path d="M10.5 13a5 5 0 1 0 3-9"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  hand:'<path d="M5 11V6a2 2 0 1 1 4 0M9 11V4a2 2 0 1 1 4 0v7M13 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6H9a4 4 0 0 1-4-4v-1l-2-3"/>',
  ext:'<path d="M14 3h7v7M21 3l-9 9M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 6a3 3 0 0 1 0 6M21 20a5.5 5.5 0 0 0-4-5"/>',
  check:'<path d="M4 12l5 5L20 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  back:'<path d="M9 6l6 6-6 6"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M5 7l1 13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-13M9 7V4h6v3"/>'
}[n]||'';return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px">${p}</svg>`}

/* تشغيل — إن وُجدت جلسة سابقة نبدأ مباشرة، وإلا نعرض بوابة الدخول. */
showGate('family');
(async ()=>{
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return;
  const {data:m} = await sb.from('managers').select('user_id').eq('user_id', session.user.id).maybeSingle();
  await enterApp(!!m);
})();
</script>
